<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GazeFollower2 Studio</title>
    <link rel="icon" type="image/png" href="./gazefollower.png">
    <link rel="apple-touch-icon" href="./gazefollower.png">
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    
    <!-- jsPsych -->
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --bg-page: #f4f6f9;
            --bg-card: #ffffff;
            --bg-card-hover: #fafbfc;
            --bg-subtle: #f7f8fa;
            --border-color: #e5e6eb;
            --border-hover: #c9cdd4;
            --border-focus: #165dff;
            --text-title: #1d2129;
            --text-body: #4e5969;
            --text-secondary: #86909c;
            --text-placeholder: #c9cdd4;
            --color-primary: #165dff;
            --color-primary-hover: #4080ff;
            --color-primary-active: #0e42d2;
            --color-primary-light: #e8f3ff;
            --color-primary-border: #bedaff;
            --color-success: #00b42a;
            --color-success-bg: #e8ffea;
            --color-success-border: #aff0b5;
            --color-warning: #ff7d00;
            --color-warning-bg: #fff7e8;
            --color-warning-border: #ffd591;
            --color-danger: #f53f3f;
            --color-danger-bg: #ffece8;
            --color-danger-border: #ffccc7;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 6px 16px -2px rgba(0, 0, 0, 0.04);
            --shadow-card-hover: 0 4px 18px -2px rgba(0, 0, 0, 0.08);
            --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(#e5e6eb 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-body);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Container Overrides for jsPsych */
        #jspsych-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jspsych-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jspsych-content {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        /* Domestic Big-Tech Style Card */
        .studio-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 24px;
            transition: all 0.2s ease;
        }

        .studio-card:hover {
            box-shadow: var(--shadow-card-hover);
        }

        /* Big-Tech Primary Buttons */
        .studio-btn {
            background: var(--color-primary);
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
            padding: 9px 24px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            box-shadow: 0 2px 6px rgba(22, 93, 255, 0.2);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            letter-spacing: normal;
        }

        .studio-btn:hover:not(:disabled) {
            background: var(--color-primary-hover);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.3);
            transform: translateY(-1px);
        }

        .studio-btn:active:not(:disabled) {
            background: var(--color-primary-active);
            transform: translateY(0);
        }

        .studio-btn:disabled {
            background: #f2f3f5;
            color: var(--text-placeholder);
            border-color: #e5e6eb;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .studio-btn-secondary {
            background: #ffffff;
            color: var(--text-title);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .studio-btn-secondary:hover:not(:disabled) {
            background: var(--bg-subtle);
            border-color: var(--border-hover);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        /* Big-Tech Form Elements */
        .studio-select, .studio-input {
            background: #ffffff;
            color: var(--text-title);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .studio-select:hover, .studio-input:hover {
            border-color: var(--border-hover);
        }

        .studio-select:focus, .studio-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.12);
        }

        .studio-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-body);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        /* Tag / Pill Badges */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--color-success-bg);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
            border-radius: var(--radius-sm);
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pill.info {
            background: var(--color-primary-light);
            color: var(--color-primary);
            border-color: var(--color-primary-border);
        }

        .status-pill.warning {
            background: var(--color-warning-bg);
            color: var(--color-warning);
            border-color: var(--color-warning-border);
        }

        .status-pill.danger {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            border-color: var(--color-danger-border);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        @keyframes gf-spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Precision Reticle Gaze Cursor */
        #gaze-cursor { 
            position: fixed; 
            width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            display: none; 
            z-index: 999999; 
            pointer-events: none; 
            background: rgba(22, 93, 255, 0.14);
            border: 2px solid #165dff; 
            box-shadow: 0 0 10px rgba(22, 93, 255, 0.35); 
            transition: left 0.04s cubic-bezier(0, 0, 0.2, 1), top 0.04s cubic-bezier(0, 0, 0.2, 1); 
        }

        #gaze-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #165dff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f2f3f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #c9cdd4;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a4abb5;
        }
    </style>
</head>
<body>
    <div id="jspsych-container"></div>
    <div id="gaze-cursor"></div>
    
    <script type="module">
        import(`./app.js?v=${new Date().getTime()}`);
    </script>
</body>
</html>
